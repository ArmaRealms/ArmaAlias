name: Maven verification
on:
  push:
    branches: [master]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify
        run: mvn -B -ntp --no-transfer-progress clean verify
      - name: Test Java string escaping without external libraries
        run: java --class-path target/classes src/test/java/com/darkblade12/simplealias/util/JavaEscapesTest.java
      - name: Test viewer placeholder tokens
        run: java --class-path target/classes src/test/java/com/darkblade12/simplealias/util/ViewerPlaceholdersTest.java
